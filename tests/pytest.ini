# Lives here, not in pyproject.toml, on purpose.
#
# The repository root is itself a Python package: ComfyUI imports a custom node by
# executing its __init__.py as a package, which is why that file uses a relative
# import. pytest builds its collection tree from the rootdir down and imports the
# __init__.py of any directory that has one -- so with the rootdir at the repo
# root it would try to import ours outside a package and fail. Keeping the config
# here puts the rootdir on tests/, which has no __init__.py.
#
# Run the suite as `pytest tests` from the repository root.
[pytest]
addopts = -q
